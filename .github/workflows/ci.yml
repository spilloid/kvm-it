name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests
        working-directory: firmware
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -o /tmp/t test/host/test_hid_state.c main/hid_state.c main/ascii_us.c && /tmp/t
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -o /tmp/p test/host/test_proto_frame.c main/proto_frame.c && /tmp/p ../protocol/vectors.txt
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -o /tmp/l test/host/test_logic.c main/proto_frame.c main/proto_dispatch.c main/hid_state.c \
            main/led_pattern.c main/button_logic.c && /tmp/l
      - name: Apply ESP-IDF patches (as scripts/fw.sh does)
        run: for p in firmware/patches/*.patch; do patch -p1 -N -d /opt/esp/idf < "$p"; done
      - name: Build firmware (release and radio-diagnostic)
        working-directory: firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3 && idf.py build
          idf.py -B build-diag -D SDKCONFIG=build-diag/sdkconfig \
            -D SDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.diag' set-target esp32s3 build
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bundled adapter firmware is current and intact
        run: |
          want=$(git log -1 --format=%H -- firmware/main firmware/CMakeLists.txt firmware/sdkconfig.defaults firmware/patches firmware/dependencies.lock)
          grep -q "$want" firmware/release/FIRMWARE.txt || { echo "firmware sources last changed in $want but firmware/release was not rebuilt from them (scripts/fw.sh build, copy firmware/build, update FIRMWARE.txt and SHA256SUMS)"; exit 1; }
          cd firmware/release && sha256sum -c SHA256SUMS
      - name: Vectors are up to date
        run: python3 protocol/gen_vectors.py && git diff --exit-code protocol
      - name: Test, lint, cross-build (container)
        run: |
          scripts/rs.sh test
          scripts/rs.sh clippy
          scripts/rs.sh windows
