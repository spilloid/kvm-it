[package]
name = "kvmit-video"
description = "HDMI capture (UVC) frames for kvm-it: V4L2 on Linux, format conversion shared across platforms"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kvmit-script = { path = "../kvmit-script" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
