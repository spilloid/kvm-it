[package]
name = "kvmit-video"
description = "HDMI capture (UVC) frames for kvm-it: V4L2 on Linux, format conversion shared across platforms"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kvmit-script = { path = "../kvmit-script" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

# macOS: AVFoundation capture (frames arrive as 32BGRA pixel buffers; the OS decodes MJPEG/YUV itself).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "block2", "dispatch2"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
# macOS text reading (workflows): Vision's text recogniser over a one-channel pixel buffer.
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "objc2-core-video", "objc2-core-foundation", "objc2-image-io"] }
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
kvmit-hid = { path = "../kvmit-hid" }
kvmit-layout = { path = "../kvmit-layout" }
serde_json = "1"
