name = "Type a secret, then Enter"
format = 1
description = "Prompts for a value at run time, types it without ever displaying or logging it, then presses Enter. Nothing is saved."

[vars]
secret = { prompt = "Value to type", secret = true }

[[steps]]
confirm = "Focus the target field now. The value will be typed and Enter pressed."
[[steps]]
secret_text = "{{secret}}"
[[steps]]
key = "ENTER"
