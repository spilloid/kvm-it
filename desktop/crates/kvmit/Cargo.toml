[package]
name = "kvmit"
description = "kvm-it controller: CLI and GUI for the ESP32-S3 USB-HID + HDMI-capture KVM"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kvmit"
path = "src/main.rs"

[[bin]]
name = "kvmit-gui"
path = "src/gui_main.rs"

[dependencies]
kvmit-hid = { path = "../kvmit-hid" }
kvmit-layout = { path = "../kvmit-layout" }
kvmit-protocol = { path = "../kvmit-protocol" }
kvmit-ble = { path = "../kvmit-ble" }
kvmit-script = { path = "../kvmit-script" }
kvmit-flash = { path = "../kvmit-flash" }
kvmit-video = { path = "../kvmit-video" }
kvmit-record = { path = "../kvmit-record" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rpassword = "7"
ctrlc = "3"
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# macOS: the keyboard grab (a Quartz event tap) and its permission check.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

# Windows icon and version resource (build.rs); a no-op for other targets.
[build-dependencies]
embed-resource = "3"
