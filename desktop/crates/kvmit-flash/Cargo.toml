[package]
name = "kvmit-flash"
description = "Flash the kvm-it ESP32-S3 adapter over its UART (COM) port: image validation, port safety rules, espflash glue"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
espflash = { version = "=4.6.0", default-features = false, features = ["serialport"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.2"
serialport = { version = "4.7", default-features = false }
