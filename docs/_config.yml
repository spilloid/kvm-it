title: kvm-it
description: A desktop KVM for provisioning headless machines, built from a USB HDMI capture card and an ESP32-S3.
theme: jekyll-theme-cayman
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collection: false
titles_from_headings:
  enabled: true
  strip_title: true
  collection: false
github:
  repository_url: https://github.com/spilloid/kvm-it
